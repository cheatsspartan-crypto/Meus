<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gerador de Keys Spartan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-admin { background: linear-gradient(135deg, #ef4444, #b91c1c); transition: all 0.3s ease; }
        .btn-admin:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        
        /* Estilo da Tabela */
        .key-row:nth-child(even) { background: rgba(255,255,255,0.02); }
        .scroll-custom::-webkit-scrollbar { width: 6px; }
        .scroll-custom::-webkit-scrollbar-track { background: transparent; }
        .scroll-custom::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col items-center">

    <canvas id="starCanvas"></canvas>

    <header class="w-full max-w-4xl flex justify-between items-center my-8">
        <div>
            <h1 class="text-2xl font-black gradient-text uppercase tracking-tighter">Spartan Admin</h1>
            <p class="text-slate-500 text-xs uppercase tracking-widest">Gerador Central de Licenças</p>
        </div>
        <div class="text-right">
            <span id="statusBadge" class="bg-yellow-500/10 text-yellow-500 text-[10px] px-3 py-1 rounded-full border border-yellow-500/20 uppercase font-bold">Modo Offline</span>
        </div>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Coluna de Geração -->
        <section class="glass-card p-6 rounded-3xl h-fit border-red-500/20">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-plus-circle text-red-500"></i> Nova Key
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-slate-500 uppercase font-bold mb-1 block">Prefixo</label>
                    <input type="text" id="prefix" value="SPARTAN" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none focus:border-red-500 transition-all text-sm uppercase">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 uppercase font-bold mb-1 block">Duração</label>
                    <select id="duration" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none focus:border-red-500 transition-all text-sm">
                        <option value="7">7 Dias (Semanal)</option>
                        <option value="30">30 Dias (Mensal)</option>
                        <option value="999">Vitalício</option>
                    </select>
                </div>
                <button onclick="generateAndSave()" class="w-full btn-admin py-4 rounded-xl font-bold uppercase tracking-widest text-sm">
                    Gerar Licença
                </button>
            </div>
        </section>

        <!-- Coluna de Lista/Gestão -->
        <section class="glass-card p-6 rounded-3xl md:col-span-2 flex flex-col h-[500px]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i class="fas fa-list text-blue-500"></i> Keys Ativas
                </h2>
                <button onclick="clearAll()" class="text-[10px] text-slate-500 hover:text-red-400 uppercase font-bold">Limpar Tudo</button>
            </div>

            <div class="flex-1 overflow-y-auto scroll-custom pr-2">
                <table class="w-full text-left">
                    <thead class="text-slate-500 text-[10px] uppercase border-b border-slate-800">
                        <tr>
                            <th class="pb-3 pl-2">Código</th>
                            <th class="pb-3 text-center">Expiração</th>
                            <th class="pb-3 text-right pr-2">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="keyList" class="text-sm">
                        <!-- Keys aparecerão aqui -->
                    </tbody>
                </table>
                <div id="emptyMsg" class="h-full flex flex-col items-center justify-center text-slate-600 italic py-20">
                    <i class="fas fa-key mb-2 text-2xl opacity-20"></i>
                    <p>Nenhuma key gerada ainda</p>
                </div>
            </div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-3 rounded-full font-bold text-sm shadow-2xl hidden z-50"></div>

    <script>
        // --- Estrelas Animadas ---
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function initStars() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; stars = []; for (let i = 0; i < 150; i++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.5 + 0.2, hue: Math.random() * 360 }); }
        function drawStars() { ctx.clearRect(0, 0, canvas.width, canvas.height); stars.forEach(s => { s.y -= s.speed; s.hue += 1; if (s.y < 0) s.y = canvas.height; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fillStyle = `hsla(${s.hue}, 70%, 70%, 0.4)`; ctx.fill(); }); requestAnimationFrame(drawStars); }
        initStars(); drawStars();

        // --- Gestão de Dados ---
        let keys = JSON.parse(localStorage.getItem('spartan_keys') || '[]');

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        function generateAndSave() {
            const prefix = document.getElementById('prefix').value.trim() || "SPARTAN";
            const duration = document.getElementById('duration').value;
            const code = prefix.toUpperCase() + "-" + Math.random().toString(36).substr(2, 9).toUpperCase();
            
            const newKey = {
                code: code,
                duration: duration,
                created: new Date().toLocaleDateString(),
                status: 'disponível'
            };

            keys.unshift(newKey);
            save();
            render();
            showToast("KEY GERADA COM SUCESSO!");
        }

        function deleteKey(index) {
            keys.splice(index, 1);
            save();
            render();
        }

        function copyKey(code) {
            const el = document.createElement('textarea');
            el.value = code;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("COPIADO: " + code);
        }

        function save() {
            localStorage.setItem('spartan_keys', JSON.stringify(keys));
        }

        function clearAll() {
            if(confirm("Deseja apagar todas as keys?")) {
                keys = [];
                save();
                render();
            }
        }

        function render() {
            const list = document.getElementById('keyList');
            const empty = document.getElementById('emptyMsg');
            list.innerHTML = '';

            if (keys.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                keys.forEach((k, index) => {
                    const row = document.createElement('tr');
                    row.className = 'key-row border-b border-slate-800/50';
                    row.innerHTML = `
                        <td class="py-4 pl-2 font-mono text-blue-400 font-bold tracking-tighter">${k.code}</td>
                        <td class="py-4 text-center text-slate-400 text-xs">${k.duration == 999 ? 'VITALÍCIO' : k.duration + ' DIAS'}</td>
                        <td class="py-4 text-right pr-2">
                            <div class="flex justify-end gap-2">
                                <button onclick="copyKey('${k.code}')" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 transition-colors">
                                    <i class="fas fa-copy text-[10px]"></i>
                                </button>
                                <button onclick="deleteKey(${index})" class="w-8 h-8 rounded-lg bg-red-900/20 text-red-500 hover:bg-red-500 hover:text-white transition-colors">
                                    <i class="fas fa-trash text-[10px]"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    list.appendChild(row);
                });
            }
        }

        render();
    </script>
</body>
</html>
