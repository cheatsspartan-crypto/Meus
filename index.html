<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spartan VIP Panel - Constelação</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(10, 1, 24, 0.9); /* Transparência para ver o fundo */
            --text-color: #ffffff;
            --secondary-text: #b18cf0;
            --success-green: #00ff00;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
            overflow: hidden;
        }

        /* Canvas de Constelações */
        #constellation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Animação Rainbow para a Borda do Painel */
        @keyframes rainbow {
            0% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000; }
            33% { border-color: #00ff00; box-shadow: 0 0 25px #00ff00; }
            66% { border-color: #0000ff; box-shadow: 0 0 25px #0000ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000; }
        }

        .panel {
            width: 350px;
            background-color: var(--panel-bg);
            border: 3px solid #ff0000;
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            animation: rainbow 6s linear infinite;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        /* Tela de Login */
        #login-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-header {
            font-size: 26px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }

        .input-key {
            background: rgba(26, 11, 46, 0.8);
            border: 1px solid #331a4d;
            padding: 15px;
            border-radius: 10px;
            color: white;
            text-align: center;
            font-size: 16px;
            outline: none;
        }

        .btn-login {
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        /* Conteúdo Principal */
        #menu-content {
            display: none;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            transition: 0.3s;
        }

        .tab-active {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }

        .tab-inactive {
            background-color: #1a0b2e;
            color: #ccc;
        }

        /* Seções de Abas */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Estilo da Aba INFO */
        .info-container {
            text-align: left;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            font-size: 15px;
            line-height: 2;
        }

        .info-container b { color: var(--secondary-text); }
        .status-online { color: var(--success-green); font-weight: bold; text-shadow: 0 0 5px var(--success-green); }

        /* Grid de Opções */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            background-color: #fff;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        input[type="checkbox"]:checked { background-color: #2575fc; }
        input[type="checkbox"]:checked::after { content: "✔"; position: absolute; color: white; font-size: 12px; left: 3px; top: 1px; }

        .range-container { margin-bottom: 20px; text-align: left; }
        .range-slider { width: 100%; -webkit-appearance: none; height: 4px; background: #331a4d; border-radius: 5px; outline: none; margin: 15px 0; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #fff; border-radius: 50%; cursor: pointer; }
        .fov-label { display: flex; justify-content: flex-end; font-size: 14px; color: #ddd; }

        .select-box { width: 100%; padding: 10px; background: #0a0118; border: 1px solid #331a4d; color: white; border-radius: 8px; margin-bottom: 25px; }

        .functions-label { color: var(--secondary-text); font-size: 16px; font-weight: bold; margin-bottom: 15px; display: block; }
        .radio-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .radio-item { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; }

        .btn-inject {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(180deg, #1a0b2e 0%, #000000 100%);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid #331a4d;
        }

        #error-msg { color: #ff4d4d; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <canvas id="constellation-canvas"></canvas>

    <div class="panel">
        <!-- TELA DE LOGIN -->
        <div id="login-screen">
            <div class="login-header">SPARTAN VIP</div>
            <input type="password" id="key-input" class="input-key" placeholder="Insira sua Key aqui">
            <button class="btn-login" onclick="checkKey()">ENTRAR</button>
            <div id="error-msg">Chave incorreta!</div>
        </div>

        <!-- CONTEÚDO DO MENU -->
        <div id="menu-content">
            <div class="header">@SPARTAN</div>

            <div class="tabs">
                <button class="tab-btn tab-active" id="tab-aim" onclick="switchTab('aim')">AIMLOCK</button>
                <button class="tab-btn tab-inactive" id="tab-info" onclick="switchTab('info')">INFO</button>
            </div>

            <!-- ABA AIMLOCK -->
            <div id="content-aim" class="tab-content active">
                <div class="options-grid">
                    <div class="option-item"><input type="checkbox" id="aimbot"><label for="aimbot">AIMBOT</label></div>
                    <div class="option-item"><input type="checkbox" id="norecoil"><label for="norecoil">No Recoil</label></div>
                    <div class="option-item"><input type="checkbox" id="aimbot2x"><label for="aimbot2x">AIMBOT 2X</label></div>
                    <div class="option-item"><input type="checkbox" id="bypass"><label for="bypass">BYPASS</label></div>
                </div>

                <div class="range-container">
                    <input type="range" min="0" max="100" value="5" class="range-slider" id="fovRange">
                    <div class="fov-label">Fov <span id="fovVal">5</span>%</div>
                </div>

                <select class="select-box">
                    <option>AUXÍLIO EXTERNAL</option>
                </select>

                <span class="functions-label">funções:</span>

                <div class="radio-group">
                    <div class="radio-item"><input type="radio" name="mode" checked> AO ATIRA</div>
                    <div class="radio-item"><input type="radio" name="mode"> AO OLHA</div>
                </div>

                <button class="btn-inject" onclick="handleInject()">INJETAR</button>
            </div>

            <!-- ABA INFO -->
            <div id="content-info" class="tab-content">
                <div class="info-container">
                    <div><b>Criador:</b> Spartan</div>
                    <div><b>Key de acesso:</b> Clientevipss</div>
                    <div><b>Status:</b> <span class="status-online">online</span></div>
                </div>
                <br>
                <p style="font-size: 12px; color: #888;">Versão: 2.0.0 VIP Edition</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Efeito de Constelação no Fundo
        const canvas = document.getElementById('constellation-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let hue = 0;

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles() {
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hue += 0.5;
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        ctx.strokeStyle = `hsla(${hue}, 100%, 50%, ${1 - distance/100})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        createParticles();
        animateParticles();

        // 2. Sistema de Abas
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('tab-active');
                b.classList.add('tab-inactive');
            });

            if (tab === 'aim') {
                document.getElementById('content-aim').classList.add('active');
                document.getElementById('tab-aim').classList.add('tab-active');
                document.getElementById('tab-aim').classList.remove('tab-inactive');
            } else {
                document.getElementById('content-info').classList.add('active');
                document.getElementById('tab-info').classList.add('tab-active');
                document.getElementById('tab-info').classList.remove('tab-inactive');
            }
        }

        // 3. Sistema de Key
        function checkKey() {
            const input = document.getElementById('key-input').value;
            const error = document.getElementById('error-msg');
            const loginScreen = document.getElementById('login-screen');
            const menuContent = document.getElementById('menu-content');

            if (input === "Clientevipss") {
                loginScreen.style.display = "none";
                menuContent.style.display = "block";
            } else {
                error.style.display = "block";
                setTimeout(() => { error.style.display = "none"; }, 2000);
            }
        }

        // 4. Slider FOV
        const slider = document.getElementById('fovRange');
        const output = document.getElementById('fovVal');
        slider.oninput = function() {
            output.innerHTML = this.value;
        }

        function handleInject() {
            const btn = document.querySelector('.btn-inject');
            btn.innerHTML = "INJETANDO...";
            setTimeout(() => {
                btn.innerHTML = "SUCESSO!";
                setTimeout(() => { btn.innerHTML = "INJETAR"; }, 2000);
            }, 1500);
        }
    </script>
</body>
</html>
